<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore the hometowns of the Billboard Global 200's leading artists with decent.band." />
    <meta name="theme-color" content="#151515" />
    <title>decent.band — Global Artist Hometowns</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Nunito:wght@800;900&family=Roboto+Condensed:wght@700;900&family=Roboto+Mono:wght@500;700&family=Stardos+Stencil:wght@700&display=swap"
      rel="stylesheet"
    />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S29ESCKGXP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-S29ESCKGXP");
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="wordmark" href="/" aria-label="decent.band home">
          <img class="wordmark__logo" src="/assets/images/decent.png" alt="decent" width="4836" height="1926" />
          <span class="wordmark__extension">.band</span>
        </a>
        <div class="header-actions">
          <span class="header-label">Global artist index</span>
          <span class="artist-count" id="artist-count" aria-live="polite">Loading artists…</span>
          <div class="view-switcher" aria-label="Choose a view">
            <button class="view-button is-active" id="map-view-button" type="button" aria-pressed="true">Map</button>
            <button class="view-button" id="list-view-button" type="button" aria-pressed="false">List</button>
          </div>
          <button class="reset-button" id="reset-view" type="button">Reset globe</button>
        </div>
      </header>

      <main class="map-stage">
        <div id="map" class="map" role="region" aria-label="Interactive globe showing artist hometowns"></div>
        <form class="artist-search map-search" role="search" aria-label="Search artists on the map">
          <label>
            <span>Artist search</span>
            <input class="artist-search__input" type="search" list="artist-suggestions" placeholder="Type an artist name" autocomplete="off" disabled />
          </label>
          <label>
            <span>Genre</span>
            <select class="artist-search__genre" disabled>
              <option value="">All genres</option>
            </select>
          </label>
          <button class="artist-search__clear" type="button">Clear</button>
        </form>
        <section class="map-intro" id="map-intro" aria-labelledby="map-heading">
          <div class="panel-meta"><span>DM // 0001</span><span>Active index</span></div>
          <p class="eyebrow">Explore artist hometowns</p>
          <h1 id="map-heading">The world’s artists.<br /><span>One globe.</span></h1>
          <p>Select a cluster or city to discover the artists connected to it.</p>
          <button id="dismiss-intro" type="button">Explore the map</button>
          <div class="panel-corner" aria-hidden="true"></div>
        </section>
        <div class="map-status" id="map-status" role="status">Preparing the globe…</div>
        <section class="list-view" id="list-view" aria-labelledby="list-heading" hidden>
          <div class="list-view__header">
            <div>
              <p class="eyebrow">Artist directory</p>
              <h1 id="list-heading" tabindex="-1">Global artist list</h1>
              <p id="list-summary">Loading artist directory…</p>
            </div>
            <div class="list-controls">
              <form class="artist-search list-search" role="search" aria-label="Search the artist list">
                <label>
                  <span>Artist search</span>
                  <input class="artist-search__input" type="search" list="artist-suggestions" placeholder="Type an artist name" autocomplete="off" disabled />
                </label>
                <label>
                  <span>Genre</span>
                  <select class="artist-search__genre" disabled>
                    <option value="">All genres</option>
                  </select>
                </label>
                <button class="artist-search__clear" type="button">Clear</button>
              </form>
              <label class="sort-control" for="artist-sort">
                <span>Sort by</span>
                <select id="artist-sort">
                  <option value="artist">Artist A–Z</option>
                  <option value="genre">Genre A–Z</option>
                  <option value="location">Location A–Z</option>
                </select>
              </label>
            </div>
          </div>
          <div class="artist-directory" id="artist-directory" aria-live="polite"></div>
        </section>
      </main>
      <datalist id="artist-suggestions"></datalist>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
