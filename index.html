<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="decent.band is coming soon." />
    <meta name="theme-color" content="#f4f7fb" />
    <title>decent.band — Coming Soon</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S29ESCKGXP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-S29ESCKGXP");
    </script>
    <style>
      :root {
        color-scheme: light;
        --primary-color: #3b86f6;
        --text-color: #231f20;
        --background-color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100svh;
        background: var(--background-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      main {
        display: grid;
        flex: 1;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }

      .coming-soon {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(1.25rem, 3vw, 2rem);
      }

      .wordmark {
        --logo-height: clamp(5rem, 16vw, 10rem);
        display: flex;
        align-items: baseline;
        justify-content: center;
        margin: 0;
        line-height: 1;
      }

      .wordmark__logo {
        display: block;
        width: auto;
        height: var(--logo-height);
      }

      .wordmark__extension {
        color: var(--primary-color);
        font-family: "Nunito", "Arial Rounded MT Bold", Arial, sans-serif;
        font-size: calc(var(--logo-height) * 0.785);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        margin-left: -0.1em;
        transform: translateY(calc(var(--logo-height) * -0.204));
      }

      .status {
        margin: 0;
        font-size: clamp(0.75rem, 1.4vw, 0.95rem);
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .site-footer {
        margin-top: auto;
        padding: 2rem 0;
        background: var(--text-color);
        color: #ffffff;
      }

      .footer-content {
        text-align: center;
      }

      .footer-text {
        margin: 0 0 1.25rem;
      }

      .footer-decent {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        margin-bottom: 1.25rem;
      }

      .footer-brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .footer-logo-image {
        display: block;
        width: auto;
        height: 44px;
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
      }

      .footer-links a {
        padding: 0.55rem 1rem;
        border: 1px solid rgb(174 177 183 / 0.1);
        border-radius: 999px;
        background: transparent;
        box-shadow: 2px 2px 0 rgb(174 177 183 / 0.35);
        color: var(--primary-color);
        font-family: "Nunito", "Arial Rounded MT Bold", Arial, sans-serif;
        font-weight: 600;
        text-decoration: none;
        transition: border-color 0.3s, color 0.3s;
      }

      .footer-links a:hover,
      .footer-links a:focus-visible {
        color: #c9ddff;
        border-color: #c9ddff;
      }

      .footer-copyright {
        margin: 0;
        opacity: 0.82;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="coming-soon" aria-labelledby="site-title">
        <h1 class="wordmark" id="site-title">
          <img
            class="wordmark__logo"
            src="./assets/images/decent.png"
            alt="decent"
            width="4836"
            height="1926"
          /><span class="wordmark__extension">.band</span>
        </h1>
        <p class="status">Coming Soon</p>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container">
        <div class="footer-content">
          <p class="footer-text">Building a more decent web, one project at a time.</p>
          <div class="footer-decent">
            <a class="footer-brand" href="https://decentsoftware.llc/" aria-label="Decent Software LLC">
              <img src="./assets/images/decent.png" alt="Decent" class="footer-logo-image" />
            </a>
            <nav class="footer-links" aria-label="Other Decent sites">
              <a href="https://decent.apartments/" target="_blank" rel="noopener">Apartments</a>
              <a href="https://decent.charity/" target="_blank" rel="noopener">Charity</a>
              <a href="https://decent.church/" target="_blank" rel="noopener">Church</a>
              <a href="https://decent.clothing/" target="_blank" rel="noopener">Clothing</a>
              <a href="https://decent.food/" target="_blank" rel="noopener">Food</a>
            </nav>
          </div>
          <p class="footer-copyright">© 2026 Decent Software LLC. All rights reserved.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
